name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version (X.Y.Z)'
        required: true
        type: string

permissions: {}  # Minimal permissions at workflow level; jobs declare their own

jobs:
  bump-and-tag:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write  # Required to open and merge the version-bump PR (main requires PRs)
      actions: write  # Required to re-trigger release.yaml via gh workflow run
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true  # Needed to push the version-bump commit and tag

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Update version files
        env:
          VERSION: ${{ inputs.version }}
        run: python tools/release.py --non-interactive "$VERSION"

      - name: Commit and push version bump on a release branch
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "release/v${VERSION}"
          git commit -m "chore: bump acp version to ${VERSION}"
          git push origin "release/v${VERSION}"

      - name: Create and merge version-bump PR
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh pr create \
            --base main \
            --head "release/v${VERSION}" \
            --title "chore: bump acp version to ${VERSION}" \
            --body "Automated version bump for release v${VERSION}."
          gh pr merge "release/v${VERSION}" --squash --delete-branch

      - name: Sync main after merge
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Create and push tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "v${VERSION}"

      - name: Trigger release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh workflow run release.yaml --ref "v${VERSION}"
