name: Shell lint

on:
  push:
    branches:
      - main
    paths:
      - '**/*.sh'
      - '.github/workflows/*.yaml'
  pull_request:
    branches:
      - main
    paths:
      - '**/*.sh'
      - '.github/workflows/*.yaml'

permissions:
  contents: read

jobs:
  shell-lint:
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    name: shellcheck-lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run ShellCheck
        run: shellcheck tests/completions/test_completions.sh
